# Render Blueprint — ShipBlu Support
#
# Frankfurt throughout, to sit next to the Supabase project in eu-central-1. A
# console page issues 10-30 queries, so app-to-database round trips dominate
# page latency; colocation keeps them at ~1-3ms instead of ~30-50ms.

previewsEnabled: false

# --------------------------------------------------------------- env groups
#
# Three groups, split by blast radius rather than by convenience:
#
#   shipblu-shared               identical in every environment, and harmless
#                                to the outside world if it is wrong
#   shipblu-support-production   anything that can reach a real customer or the
#                                production database
#   shipblu-support-staging      staging's own database, and the settings that
#                                stop it reaching anyone
#
# The rule inside a group is the one this file has always had: a value that is
# the same on more than one service in that environment is declared once, in the
# group, and nowhere else.
#
# Render gives service-level variables precedence over group values, so a key
# declared in both places takes the service value and the group is silently
# ignored. DATABASE_URL was declared per-service with `sync: false` on all seven
# services and did exactly that — editing the group appeared to do nothing,
# everywhere at once. One declaration site removes the failure mode.
#
# Rotation is the other reason. A Meta access token pasted into three services is
# a rotation you have to remember to do three times, and forgetting leaves a
# half-working system rather than a clean break.
#
# **No group entry below carries a secret, and none uses `sync: false` either.**
# Render's Blueprint reference rules `sync: false` out inside an environment
# group, and a group entry has to have either a literal value or
# `generateValue` — a literal would put the secret in the repo, and `value: ''`
# would blank the real one on the next sync. So each group lists its
# dashboard-owned keys as a comment instead. The blueprint still names
# everything the group holds, which is the point of keeping it in the repo,
# without being the place the value lives.

# `shipblu-shared` sits outside the project, and it has to.
#
# A group scoped to a project environment cannot be linked to any service
# outside that environment, and Render has no project-wide scope in between: a
# group belongs to exactly one environment, or to the whole workspace. Services
# in both environments link this one, so workspace-level is the only scope that
# works for it. `ungrouped` is how a Blueprint says that outright — leaving the
# group in a top-level `envVarGroups` list would instead mean "keep whatever
# scope it happens to have", which is not a thing to leave to chance.
ungrouped:
  envVarGroups:
    - name: shipblu-shared
      envVars:
        - key: NODE_VERSION
          value: '22'
        - key: EMAIL_FROM_NAME
          value: ShipBlu Support
        - key: SUPABASE_STORAGE_BUCKET
          value: attachments

        # APP_SECRET must be identical across every service in an environment.
        # It signs the email reply tokens (support+c42.<sig>@): the worker
        # generates one when sending and verifies it when the customer replies.
        # If the values differ, every reply fails verification and silently
        # opens a new ticket instead of threading — which is why it cannot be a
        # per-service `generateValue`, as that mints a different secret for each
        # service.
        #
        # It stays here rather than splitting into the two environment groups,
        # which would otherwise be tidier. Splitting it regenerates production's
        # value, and that invalidates every reply token already sitting in a
        # customer's mailbox. Staging holding the same signing key is the
        # cheaper of the two costs: it sends no real mail (EMAIL_PROVIDER=local
        # below), so it mints no token anybody can reply to.
        - key: APP_SECRET
          generateValue: true

        # Dashboard-owned, listed rather than declared — see the note above.
        #
        #   SHIPMENT_TRACKING_PATTERN   what a tracking number looks like
        #   SHIPMENT_SBID_PATTERN       what an SBID looks like
        #   SHIPMENT_IGNORE             references never to link
        #
        # Shared rather than per-environment because both halves of one system
        # have to agree on the answer: the web service applies the pattern when
        # an agent searches `track:...`, the worker applies it to every inbound
        # message, and a service that disagreed would link a ticket the search
        # could never find again. Unset means the defaults in
        # lib/shipments/detect.ts, which are deliberately conservative until the
        # real ShipBlu formats are confirmed — so all three are normally absent,
        # and exist only to correct those defaults without a deploy.

projects:
  # The project name is the one already in the dashboard. **The two environment
  # names below are not confirmed.** A Blueprint adopts a service by name, and
  # Render does not document what it does with a project or environment name
  # that matches nothing — so check `production` and `staging` against the
  # dashboard before the first sync, rather than discovering afterwards that it
  # built new environments and moved the services into them.
  #
  # `shipblu-support-staging` names both this environment's group and the web
  # service in it. Render keeps groups and services in separate namespaces so
  # `fromGroup` still resolves, but the two are only telling apart by context.
  - name: 'ShipBlu Support Platform'
    environments:
      # ------------------------------------------------------------ production
      - name: production
        envVarGroups:
          - name: shipblu-support-production
            envVars:
              - key: EMAIL_PROVIDER
                value: postmark

              # Dashboard-owned, listed rather than declared:
              #
              #   DATABASE_URL             Supavisor transaction pooler
              #   DATABASE_URL_SESSION     direct connection, for LISTEN
              #   SUPABASE_URL             storage, for attachments
              #   SUPABASE_SERVICE_ROLE_KEY
              #
              #   EMAIL_API_KEY            Postmark server token
              #   EMAIL_FROM_ADDRESS
              #   EMAIL_REPLY_DOMAIN       builds support+<token>@
              #
              #   META_PAGE_ACCESS_TOKEN   sends on every Meta channel
              #   META_APP_SECRET          verifies X-Hub-Signature-256
              #   META_VERIFY_TOKEN        answers the subscription handshake
              #   META_APP_ID              addresses the subscription endpoint
              #   FACEBOOK_PAGE_ID
              #   INSTAGRAM_ACCOUNT_ID
              #   WHATSAPP_PHONE_NUMBER_ID
              #   WHATSAPP_WABA_ID
              #
              #   KB_PUBLIC_HOST           host the help centre answers on
              #   WIDGET_ALLOWED_ORIGINS   origins allowed to frame the widget
              #
              # The Meta credentials are one set for three channels, because one
              # Meta app serves WhatsApp, Messenger and Instagram. There used to
              # be a WHATSAPP_ACCESS_TOKEN, WHATSAPP_APP_SECRET and
              # WHATSAPP_VERIFY_TOKEN alongside them with the code falling back
              # to them; the duplication meant the same secret was pasted twice
              # and a rotation done once left the other copy stale — which is
              # how the access token spent a day expired while nobody could tell
              # which of the two names the failing call had read.
              #
              # They are in *this* group rather than the shared one so that
              # staging cannot inherit them. Meta has no test mode: a send from
              # staging carrying a real page token arrives on a real customer's
              # phone. Staging used to override META_PAGE_ACCESS_TOKEN with a
              # blank value to prevent exactly that, which worked but depended
              # on somebody remembering to write the override. Not holding the
              # credential at all is the same protection without the vigilance.
              #
              # WHATSAPP_PHONE_NUMBER_ID and WHATSAPP_WABA_ID are ids, not
              # credentials, and since more than one WABA can be connected they
              # are the fallback rather than the configuration: connections are
              # `whatsapp_accounts` rows edited under Settings → Channels, and
              # the template sync turns WHATSAPP_WABA_ID into the first of them
              # on its next run. They still matter — they are what a fresh
              # install sends with before anything is connected.
              #
              # A connected WABA that needs its own credential names the
              # variable holding it, and the name must start `WHATSAPP_TOKEN_`
              # (enforced in lib/whatsapp/accounts.ts, because the value is sent
              # to Meta as a bearer token and a free-text variable name would be
              # a way to exfiltrate any secret in the process). Add such a key
              # to this list in the same commit that names it on the account.
              # Only the token varies per account: META_APP_SECRET and
              # META_VERIFY_TOKEN belong to the Meta *app*, so every connected
              # WABA has to sit under the same one — a WABA on a second app
              # would have its webhooks stored unverified and answered 403.

        services:
          - type: web
            name: shipblu-support
            runtime: node
            region: frankfurt
            plan: standard # 2GB RAM / 1 CPU
            branch: main
            buildCommand: npm ci --include=dev && npm run build
            # Runs after build, before traffic shifts. Migrations are idempotent,
            # so a rolled-back deploy re-running them is safe.
            preDeployCommand: npm run db:migrate
            startCommand: npm run start
            healthCheckPath: /api/health
            scaling:
              minInstances: 1
              maxInstances: 3
              targetCPUPercent: 70
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production
              - key: NODE_ENV
                value: production
              # APP_URL is per-service rather than in the group because the cron
              # services below deliberately do not have it at all — see the note
              # there. Web and worker do hold the same value.
              - key: APP_URL
                sync: false
              # Only the web service receives inbound webhooks, so the Basic
              # Auth password Postmark presents lives here rather than in the
              # group — a secret with one consumer belongs on its one consumer.
              - key: EMAIL_WEBHOOK_SECRET
                sync: false
              # Freshdesk credentials are read only by the knowledge base
              # importer, which runs as a queued job on this service and nowhere
              # else, so the same rule keeps them here. They can go once the
              # migration is done.
              - key: FRESHDESK_DOMAIN
                sync: false
              - key: FRESHDESK_API_KEY
                sync: false
              # Re-declaring any group key here would shadow the group and take
              # the service value instead.

          - type: worker
            name: shipblu-support-worker
            runtime: node
            region: frankfurt
            plan: starter # 512MB / 0.5 CPU — the worker is I/O bound, not CPU bound
            branch: main
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm run worker
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production
              - key: NODE_ENV
                value: production
              - key: APP_URL
                sync: false

          # ------------------------------------------------------- cron jobs
          # These run `npm run job -- <type>` directly rather than hitting an
          # HTTP endpoint: the cron run's exit code then reflects whether the
          # work actually succeeded, and there is no shared secret or request
          # timeout involved.
          #
          # None of them declares APP_URL. A cron has no address of its own and
          # builds no links, and `appUrl()` now asks for the variable only where
          # a link is actually constructed. sla-sweep used to declare it with
          # `sync: false`, which meant "a human will set this in the dashboard" —
          # nobody ever did, so the value was undefined and every job that opened
          # a database connection failed validation on a variable it had no use
          # for.

          # Two jobs on one schedule, chained the way shipblu-nightly chains
          # cleanup and the rollup. They want the same cadence and neither takes
          # long, and a cron service of its own would be a second container
          # booting every five minutes to run a query that usually returns
          # nothing.
          #
          # Order matters: the SLA sweep first, so a ticket the assignment sweep
          # is about to hand to somebody carries its breach flags when they open
          # it. `&&` rather than `;` — if the SLA sweep dies the run should go
          # red rather than reporting success because the second half worked.
          - type: cron
            name: shipblu-sla-sweep
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            schedule: '*/5 * * * *' # SLA breaches need minute-ish resolution
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- sla_sweep && npm run job -- assign_sweep
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production

          - type: cron
            name: shipblu-time-automations
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            schedule: '*/15 * * * *'
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- run_time_automations
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production

          # This runs two jobs now, chained the way shipblu-nightly chains
          # cleanup and the rollup: both want an hourly cadence, neither takes
          # long, and a cron service of its own would be a second container
          # booting every hour to run one grouped count.
          #
          # **The name is deliberately not updated to match.** Renaming a service
          # in a Blueprint is a delete and a create, not a rename, and losing a
          # cron's history is a worse outcome than a name that is narrower than
          # what it runs.
          #
          # The backlog snapshot is hourly rather than once at midnight because
          # "open at day end" is the one productivity figure that cannot be
          # recomputed later, and Render's schedules are UTC while Cairo observes
          # DST — a fixed end-of-day cron is on the wrong side of midnight for
          # half the year. Sampling hourly lets the rollup pick the sample
          # nearest the boundary in the reporting zone instead.
          #
          # `;` rather than `&&`: the template sync is the half that depends on
          # Meta being configured, and a run that goes red there must not also
          # stop the snapshot, whose measurement cannot be taken again once the
          # hour has passed.
          - type: cron
            name: shipblu-whatsapp-template-sync
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            schedule: '0 * * * *'
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- sync_whatsapp_templates; npm run job -- snapshot_backlog
            envVars:
              # WHATSAPP_WABA_ID and META_PAGE_ACCESS_TOKEN come from
              # shipblu-support-production. The handler skips cleanly while they are unset, so
              # this cron is green from the day the Blueprint creates it rather
              # than red until Meta is configured.
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production

          - type: cron
            name: shipblu-nightly
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            # 02:00 Africa/Cairo = 00:00 UTC. Render cron schedules are UTC.
            schedule: '0 0 * * *'
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- cleanup && npm run job -- rollup_metrics
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production

      # --------------------------------------------------------------- staging
      - name: staging
        envVarGroups:
          - name: shipblu-support-staging
            envVars:
              # Staging never reaches a real customer, and this group is most of
              # how that is guaranteed.
              #
              # EMAIL_PROVIDER=local writes to .mail-outbox/ instead of calling
              # Postmark. It is set here rather than as a service-level override
              # so that it holds for anything added to this environment later —
              # a staging worker, say — instead of only for the one service
              # somebody remembered to write it on.
              #
              # The Meta credentials are simply absent: they live in
              # shipblu-support-production, which nothing in this environment links, so there
              # is nothing to override and nothing to blank. `pageToken()` in
              # lib/meta/client.ts throws "META_PAGE_ACCESS_TOKEN is not
              # configured" on an unset value exactly as it did on the blank one.
              - key: EMAIL_PROVIDER
                value: local

              # Dashboard-owned, listed rather than declared:
              #
              #   DATABASE_URL             staging's own Supabase project
              #   DATABASE_URL_SESSION
              #   SUPABASE_URL
              #   SUPABASE_SERVICE_ROLE_KEY
              #
              # Its own database, so that its migrations run against staging
              # rather than production.

        services:
          - type: web
            name: shipblu-support-staging
            runtime: node
            region: frankfurt
            plan: starter
            branch: claude/shipblu-support-app-03p2we
            buildCommand: npm ci --include=dev && npm run build
            preDeployCommand: npm run db:migrate
            startCommand: npm run start
            healthCheckPath: /api/health
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-staging
              - key: NODE_ENV
                value: production
              - key: APP_URL
                sync: false
