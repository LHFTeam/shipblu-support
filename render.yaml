# Render Blueprint — ShipBlu Support
#
# Frankfurt throughout, to sit next to the Supabase project in eu-central-1. A
# console page issues 10-30 queries, so app-to-database round trips dominate
# page latency; colocation keeps them at ~1-3ms instead of ~30-50ms.

previewsEnabled: false

envVarGroups:
  # Shared settings. Secret *values* are set in the dashboard, never committed.
  #
  # The rule: any value that is the same on more than one service is declared
  # here and nowhere else.
  #
  # Render gives service-level variables precedence over group values, so a key
  # declared in both places takes the service value and the group is silently
  # ignored. DATABASE_URL was declared per-service with `sync: false` on all
  # seven services and did exactly that — editing the group appeared to do
  # nothing, everywhere at once. One declaration site removes the failure mode.
  #
  # Rotation is the other reason. A Meta access token or an AWS key pasted into
  # three services is a rotation you have to remember to do three times, and
  # forgetting leaves a half-working system rather than a clean break.
  #
  # Service-level overrides are therefore deliberate exceptions, and each one
  # below says why it exists.
  - name: shipblu-shared
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: EMAIL_FROM_NAME
        value: ShipBlu Support
      - key: SUPABASE_STORAGE_BUCKET
        value: attachments

      # Supavisor pooler URLs. Already group-managed in the dashboard; declared
      # here so the Blueprint documents them rather than only describing them in
      # a comment. `sync: false` means the value stays dashboard-owned.
      #
      # Staging overrides both at service level so its migrations run against
      # its own database rather than production's.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SESSION
        sync: false
      # APP_SECRET MUST be identical across every service. It signs the email
      # reply tokens (support+c42.<sig>@): the worker generates one when sending
      # and verifies it when the customer replies. If the values differ, every
      # reply fails verification and silently opens a new ticket instead of
      # threading. It lives in the shared group precisely so there is exactly
      # one value — per-service generateValue would produce a different secret
      # for each service.
      - key: APP_SECRET
        generateValue: true

      # Shipment reference detection. Shared rather than per-service because
      # both halves have to agree on what a tracking number looks like: the web
      # service applies the pattern when an agent searches `track:...`, the
      # worker applies it to every inbound message, and a service that disagreed
      # would link a ticket the search could never find again.
      #
      # Unset means the defaults in lib/shipments/detect.ts, which are
      # deliberately conservative until the real ShipBlu formats are confirmed.
      - key: SHIPMENT_TRACKING_PATTERN
        sync: false
      - key: SHIPMENT_SBID_PATTERN
        sync: false
      - key: SHIPMENT_IGNORE
        sync: false

      # Meta, for all three channels. One app serves WhatsApp, Messenger and
      # Instagram, so there is one credential set rather than a WhatsApp copy of
      # each alongside it.
      #
      # The Page token sends on every channel — Messenger, Instagram Direct,
      # both comment streams, WhatsApp — and lists WhatsApp templates. The app
      # secret verifies X-Hub-Signature-256 on every inbound webhook and the
      # verify token answers every subscription handshake.
      #
      # There used to be a WHATSAPP_ACCESS_TOKEN, WHATSAPP_APP_SECRET and
      # WHATSAPP_VERIFY_TOKEN here too, with the code falling back to them. The
      # duplication meant the same secret was pasted twice and a rotation done
      # once left the other copy stale — which is exactly how the access token
      # spent a day expired while nobody could tell which of the two names the
      # failing call had read.
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false

      # Postmark. The server token is used by the worker to send and by the web
      # service to construct the driver that parses inbound, so it is shared.
      #
      # EMAIL_WEBHOOK_SECRET is deliberately *not* here — only the web service
      # receives webhooks, and a secret with one consumer belongs on that one
      # service rather than on all seven.
      - key: EMAIL_PROVIDER
        value: postmark
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_REPLY_DOMAIN
        sync: false

      # Hostname the public help centre answers on. The proxy rewrites requests
      # arriving here under /kb, and canonical and sitemap URLs are built from
      # it — a sitemap advertising the Render service URL would get that
      # hostname indexed and split the site's search ranking across two domains.
      - key: KB_PUBLIC_HOST
        sync: false

      # Origins allowed to embed the chat widget, comma separated. Everything
      # else keeps X-Frame-Options: DENY, so only this route can be framed and
      # only by these sites — an omission here means the widget silently fails
      # to load rather than being embeddable by anyone.
      - key: WIDGET_ALLOWED_ORIGINS
        sync: false

      # Which WhatsApp number and business account to use. Ids rather than
      # credentials — the token, app secret and verify token they are used with
      # are the Meta ones above.
      #
      # The worker sends and downloads media with the phone number id, and the
      # template sync cron lists templates with the WABA id, which is what makes
      # these a group rather than a per-service concern.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false

  # Still per-service, and inconsistent with the rule above: SUPABASE_URL and
  # SUPABASE_SERVICE_ROLE_KEY are identical on the web service and the worker.
  #
  # They are not moved here yet because they already hold live values at service
  # level. Removing a declaration from this file can drop the value on the next
  # Blueprint sync, so that move has to be sequenced: set each value in the
  # group first, confirm it, then delete the per-service entries. The EMAIL_*
  # keys moved in one step because they had never been set — the SES switch was
  # abandoned before any value was entered.
  #
  # APP_URL stays per-service permanently — it genuinely differs between
  # production and staging.

services:
  # ---------------------------------------------------------------- production
  - type: web
    name: shipblu-support
    runtime: node
    region: frankfurt
    plan: standard # 2GB RAM / 1 CPU
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    # Runs after build, before traffic shifts. Migrations are idempotent, so a
    # rolled-back deploy re-running them is safe.
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    scaling:
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 70
    envVars:
      - fromGroup: shipblu-shared
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Only the web service receives inbound webhooks, so the Basic Auth
      # password Postmark presents lives here rather than in the group.
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      # EMAIL_*, WHATSAPP_* and the database URLs come from shipblu-shared.
      #
      # Freshdesk credentials are read only by the knowledge base importer,
      # which runs as a queued job on this worker and nowhere else — so by the
      # rule above they stay here rather than going in the group. They can be
      # removed once the migration is done.
      - key: FRESHDESK_DOMAIN
        sync: false
      - key: FRESHDESK_API_KEY
        sync: false
      # Re-declaring any of them here would shadow the group and take the
      # service value instead.

  - type: worker
    name: shipblu-support-worker
    runtime: node
    region: frankfurt
    plan: starter # 512MB / 0.5 CPU — the worker is I/O bound, not CPU bound
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run worker
    envVars:
      - fromGroup: shipblu-shared
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # EMAIL_*, WHATSAPP_* and the database URLs come from shipblu-shared.

  # -------------------------------------------------------------- staging
  - type: web
    name: shipblu-support-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: claude/shipblu-support-app-03p2we
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: shipblu-shared
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SESSION
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Staging never reaches a real customer.
      #
      # EMAIL_PROVIDER=local writes to .mail-outbox/ instead of calling
      # Postmark, which also makes the inherited server token inert — the
      # Postmark driver is never constructed.
      #
      # Meta has no such switch, so the token is blanked explicitly. It is
      # inherited from the group, and Meta's API has no test mode: a send from
      # staging would arrive on a real customer's phone. Blank makes the client
      # throw "META_PAGE_ACCESS_TOKEN is not configured" instead.
      #
      # Blanking one key now covers all three channels rather than WhatsApp
      # alone. That is a gain, not a side effect: staging could previously still
      # reach a real person on Messenger or Instagram, because the token those
      # sent with was a different variable that nothing here overrode.
      #
      # Today staging has no worker to run a send job at all, but that is an
      # accident of the current topology rather than a guarantee, and this does
      # not depend on it staying true.
      - key: EMAIL_PROVIDER
        value: local
      - key: META_PAGE_ACCESS_TOKEN
        value: ''

  # ------------------------------------------------------------- cron jobs
  # These run `npm run job -- <type>` directly rather than hitting an HTTP
  # endpoint: the cron run's exit code then reflects whether the work actually
  # succeeded, and there is no shared secret or request timeout involved.
  #
  # None of them declares APP_URL. A cron has no address of its own and builds
  # no links, and `appUrl()` now asks for the variable only where a link is
  # actually constructed. sla-sweep used to declare it with `sync: false`, which
  # meant "a human will set this in the dashboard" — nobody ever did, so the
  # value was undefined and every job that opened a database connection failed
  # validation on a variable it had no use for.

  - type: cron
    name: shipblu-sla-sweep
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: '*/5 * * * *' # SLA breaches need minute-ish resolution
    buildCommand: npm ci --include=dev
    startCommand: npm run job -- sla_sweep
    envVars:
      - fromGroup: shipblu-shared

  - type: cron
    name: shipblu-time-automations
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: '*/15 * * * *'
    buildCommand: npm ci --include=dev
    startCommand: npm run job -- run_time_automations
    envVars:
      - fromGroup: shipblu-shared

  - type: cron
    name: shipblu-whatsapp-template-sync
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: '0 * * * *'
    buildCommand: npm ci --include=dev
    startCommand: npm run job -- sync_whatsapp_templates
    envVars:
      # WHATSAPP_WABA_ID and META_PAGE_ACCESS_TOKEN come from shipblu-shared.
      # The handler skips cleanly while they are unset, so this cron is green
      # from the day the Blueprint creates it rather than red until Meta is
      # configured.
      - fromGroup: shipblu-shared

  - type: cron
    name: shipblu-nightly
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # 02:00 Africa/Cairo = 00:00 UTC. Render cron schedules are UTC.
    schedule: '0 0 * * *'
    buildCommand: npm ci --include=dev
    startCommand: npm run job -- cleanup && npm run job -- rollup_metrics
    envVars:
      - fromGroup: shipblu-shared
