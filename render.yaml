# Render Blueprint — ShipBlu Support
#
# Frankfurt throughout, to sit next to the Supabase project in eu-central-1. A
# console page issues 10-30 queries, so app-to-database round trips dominate
# page latency; colocation keeps them at ~1-3ms instead of ~30-50ms.

previewsEnabled: false

# --------------------------------------------------------------- env groups
#
# Three groups, split by blast radius rather than by convenience:
#
#   shipblu-shared               identical in every environment, and harmless
#                                to the outside world if it is wrong
#   shipblu-support-production   anything that can reach a real customer or the
#                                production database
#   shipblu-support-staging      staging's own database, and the settings that
#                                stop it reaching anyone
#
# The rule inside a group is the one this file has always had: a value that is
# the same on more than one service in that environment is declared once, in the
# group, and nowhere else.
#
# Render gives service-level variables precedence over group values, so a key
# declared in both places takes the service value and the group is silently
# ignored. DATABASE_URL was declared per-service with `sync: false` on all seven
# services and did exactly that — editing the group appeared to do nothing,
# everywhere at once. One declaration site removes the failure mode.
#
# Rotation is the other reason. A Meta access token pasted into three services is
# a rotation you have to remember to do three times, and forgetting leaves a
# half-working system rather than a clean break.
#
# **No group entry below carries a value, and none uses `sync: false` either.**
# Render's Blueprint reference rules `sync: false` out inside an environment
# group, and a group entry has to have either a literal value or
# `generateValue` — a literal would put the secret in the repo, and `value: ''`
# would blank the real one on the next sync. So each group lists its keys as a
# comment instead, and declares `envVars: []` ("zero or more" is the spec's
# wording). The blueprint still names everything the group holds, which is the
# point of keeping it in the repo, without being the place the value lives.
#
# That now covers the non-secret keys too (NODE_VERSION, EMAIL_FROM_NAME,
# EMAIL_PROVIDER, SUPABASE_STORAGE_BUCKET), which used to be literals here. A
# literal is a value a sync writes over whatever the dashboard holds, and the
# blueprint had drifted far enough from the dashboard — it generated an
# APP_SECRET into shipblu-shared that actually lives in production, which on a
# successful sync would have minted a second signing key beside the real one —
# that describing rather than asserting is the safe direction. Put a literal
# back only after reading the live value it would replace.
#
# The key lists below are the dashboard's as of 2026-09-25, read by hand from
# each group and service. Change them in the same commit as the dashboard.
#
# **Known duplicates, recorded rather than resolved.** Render gives a service
# value precedence over a group value, and documents no tiebreak between two
# groups linked by one service. Today:
#
#   KB_PUBLIC_HOST, SUPABASE_STORAGE_BUCKET   in both shipblu-shared and
#                                             shipblu-support-production
#   APP_URL                                   in shipblu-support-production and
#                                             on the web and worker services,
#                                             whose value wins there
#   EMAIL_PROVIDER                            in shipblu-shared and in
#                                             shipblu-support-staging
#
# Each should be deleted from all but one place in the dashboard; see the notes
# beside each group for which copy is the one to keep.

# `shipblu-shared` sits outside the project, and it has to.
#
# A group scoped to a project environment cannot be linked to any service
# outside that environment, and Render has no project-wide scope in between: a
# group belongs to exactly one environment, or to the whole workspace. Services
# in both environments link this one, so workspace-level is the only scope that
# works for it. `ungrouped` is how a Blueprint says that outright — leaving the
# group in a top-level `envVarGroups` list would instead mean "keep whatever
# scope it happens to have", which is not a thing to leave to chance.
ungrouped:
  envVarGroups:
    - name: shipblu-shared
      # Dashboard-owned, listed rather than declared — see the note above.
      #
      #   NODE_VERSION
      #   EMAIL_PROVIDER             postmark | local
      #   EMAIL_API_KEY              Postmark server token
      #   EMAIL_FROM_ADDRESS
      #   EMAIL_FROM_NAME
      #   EMAIL_REPLY_DOMAIN         builds support+<token>@
      #   SUPABASE_STORAGE_BUCKET    duplicate — also in production
      #   KB_PUBLIC_HOST             duplicate — also in production
      #   WIDGET_ALLOWED_ORIGINS     origins allowed to frame the widget
      #
      #   META_PAGE_ACCESS_TOKEN     sends on every Meta channel
      #   META_APP_SECRET            verifies X-Hub-Signature-256
      #   META_VERIFY_TOKEN          answers the subscription handshake
      #   META_APP_ID                addresses the subscription endpoint
      #   FACEBOOK_PAGE_ID
      #   INSTAGRAM_ACCOUNT_ID
      #   INSTAGRAM_APP_SECRET       signs the `instagram` object's webhooks
      #                              delivered by the Instagram Login
      #                              connection. Both secrets are tried, so
      #                              neither can be removed while both
      #                              connections are live.
      #   META_INSTAGRAM_APP_SECRET  the same value under the name this repo
      #                              shipped first; still read, so a rename
      #                              cannot drop a channel. Unset once the log
      #                              says Instagram is verifying with
      #                              INSTAGRAM_APP_SECRET.
      #   INSTAGRAM_ACCESS_TOKEN     sends, replies and moderates against
      #                              graph.instagram.com. Setting it is what
      #                              routes Instagram off the Page token — and
      #                              it must be set *with* the secret above,
      #                              never before it.
      #   WHATSAPP_PHONE_NUMBER_ID
      #   WHATSAPP_WABA_ID
      #   WHATSAPP_TOKEN_SHIPBLU     a connected WABA's own credential, named on
      #                              its `whatsapp_accounts` row
      #   TYPESAFE_API_KEY           TypeSafe System One, read only by the shadow
      #                              categorisation job
      #
      # Present in the dashboard but read by nothing in this repo:
      #
      #   WHATSAPP_APP_SECRET        retired WhatsApp-specific names. Nothing
      #   WHATSAPP_VERIFY_TOKEN      looks for them any more, not even to warn;
      #                              META_APP_SECRET and META_VERIFY_TOKEN are
      #                              what verifies. Safe to delete.
      #   META_SYSTEM_ADMIN_TOKEN    not referenced by any code — presumably a
      #   FB_PAGE_ACCESS_TOKEN_ALI   hand-kept credential. Confirm who uses it
      #                              before deleting.
      #
      # **The Meta credentials and TYPESAFE_API_KEY are in the wrong group.**
      # They were meant to live in shipblu-support-production so that staging
      # could not inherit them: Meta has no test mode, so a send from staging
      # carrying a real page token arrives on a real customer's phone, and the
      # TypeSafe job sends real customer text to a third party. In this group,
      # staging holds all of them. It is suspended, which is the only thing
      # keeping that inert — move them to shipblu-support-production (the
      # production services link both groups, so they lose nothing) before
      # staging is resumed. EMAIL_API_KEY is the same case one step removed:
      # staging only avoids Postmark while EMAIL_PROVIDER=local wins there.
      #
      # APP_SECRET is *not* here, contrary to what this file used to say: it
      # lives in shipblu-support-production. It must be identical across every
      # service in an environment — it signs the email reply tokens
      # (support+c42.<sig>@), the worker generates one when sending and verifies
      # it when the customer replies — so it can never be a per-service
      # `generateValue`, and never be regenerated without invalidating every
      # reply token already sitting in a customer's mailbox.
      #
      # Read by the code, normally unset, and set nowhere today:
      #
      #   SHIPMENT_TRACKING_PATTERN   what a tracking number looks like
      #   SHIPMENT_SBID_PATTERN       what an SBID looks like
      #   SHIPMENT_IGNORE             references never to link
      #   SHIPBLU_API_URL             the delivery platform's base URL
      #   CATEGORISE_DISABLED_RULES   rule keys to stop applying
      #   CATEGORISE_AUTO_MIN         confidence at which a category auto-applies
      #   CATEGORISE_RECORD_MIN       confidence below which nothing is written
      #
      # Shared, when set, because both halves of one system have to agree on
      # the answer: the web service applies the pattern when an agent searches
      # `track:...`, the worker applies it to every inbound message, and a
      # service that disagreed would link a ticket the search could never find
      # again. Unset means the defaults in lib/shipments/detect.ts and
      # DEFAULT_SHIPBLU_API_URL in lib/shipments/platform.ts. Note that staging
      # therefore reads *production* parcels.
      #
      # EMAIL_REPLY_PLUS_ADDRESSING is deliberately not set anywhere, which reads
      # as off. shipblu.com's MX is Zoho, and the route in is a Zoho forwarding
      # rule on the one address help-support@shipblu.com — a plus-suffixed
      # variant is rejected there and never reaches Postmark, so advertising one
      # in Reply-To bounced the first reply anybody sent us
      # (docs/PROJECT-STATE.md §6.41). Set it to "true" only after a Zoho rule
      # covers help-support+*@shipblu.com and a plus-addressed test mail has been
      # seen landing in webhook_events.
      #
      # A connected WABA that needs its own credential names the variable
      # holding it, and the name must start `WHATSAPP_TOKEN_` (enforced in
      # lib/whatsapp/accounts.ts, because the value is sent to Meta as a bearer
      # token and a free-text variable name would be a way to exfiltrate any
      # secret in the process). Add such a key to this list in the same commit
      # that names it on the account. Only the token varies per account:
      # META_APP_SECRET and META_VERIFY_TOKEN belong to the Meta *app*.
      envVars: []

projects:
  # These three names are the dashboard's, capitalisation included. A Blueprint
  # adopts a service by name, and Render does not document what it does with a
  # project or environment name that matches nothing — a typo here does not
  # fail, it builds a second project and moves the services into it.
  #
  # `shipblu-support-staging` names both this environment's group and the web
  # service in it. Render keeps groups and services in separate namespaces so
  # `fromGroup` still resolves, but the two are only telling apart by context.
  - name: 'ShipBlu Support Platform'
    environments:
      # ------------------------------------------------------------ production
      - name: Production
        envVarGroups:
          - name: shipblu-support-production
            # Dashboard-owned, listed rather than declared:
            #
            #   APP_SECRET                 signs email reply tokens — see the
            #                              shipblu-shared note. Never regenerate.
            #   APP_URL                    shadowed on web and worker by their
            #                              own APP_URL; the crons read this one.
            #                              Delete the service copies once the
            #                              values are confirmed identical.
            #   DATABASE_URL               Supavisor transaction pooler
            #   DATABASE_URL_SESSION       direct connection, for LISTEN
            #   SUPABASE_URL               storage, for attachments
            #   SUPABASE_SERVICE_ROLE_KEY
            #   SUPABASE_STORAGE_BUCKET    duplicate — also in shipblu-shared.
            #                              Keep the shared one.
            #   KB_PUBLIC_HOST             duplicate — also in shipblu-shared.
            #                              Keep this one: the help centre's host
            #                              differs per environment.
            #
            # Read by the code, set nowhere today, and belonging here when set:
            #
            #   WIDGET_IDENTITY_SECRET   signs an identity the merchant dashboard
            #                            asserts for its signed-in user. Its own
            #                            value per environment: a signature minted
            #                            against one deployment would otherwise
            #                            be replayable at the other.
            #   KB_NOTICE_EN             service notice, English
            #   KB_NOTICE_AR             service notice, Arabic
            #   KB_NOTICE_HREF           optional "read the update" link
            #   KB_NOTICE_TONE           info | warning | danger
            #   TYPESAFE_MODEL           pins a shadow run to one Jev version
            #                            instead of the moving `jev-latest`
            #
            # The notice keys are dashboard-owned because their whole point is
            # that ops can put a delay warning in front of every customer
            # without opening a pull request, and here rather than shared so a
            # notice set once does not appear on staging long after
            # production's outage ended. Unset is no banner.
            #
            # The Instagram pair is the one exception to "one app, one
            # credential". An Instagram professional account connected through
            # Instagram Login rather than through its Facebook Page gets its own
            # app secret and its own access token inside the same app, and on
            # 2026-08-26 the account was moved without them: from 07:37 UTC
            # every Instagram delivery failed signature verification — 2,309 in
            # thirteen hours — while Facebook's kept verifying against the
            # unchanged META_APP_SECRET. Set both or neither. See
            # lib/meta/connection.ts.
            envVars: []

        services:
          - type: web
            name: shipblu-support
            runtime: node
            region: frankfurt
            plan: standard # 2GB RAM / 1 CPU
            branch: main
            # Matches the dashboard. Nothing in production deploys itself — a
            # deploy is triggered by hand (docs/PROJECT-STATE.md §2).
            autoDeployTrigger: 'off' # quoted: bare off is YAML 1.1 for false
            buildCommand: npm ci --include=dev && npm run build
            # Runs after build, before traffic shifts. Migrations are idempotent,
            # so a rolled-back deploy re-running them is safe.
            preDeployCommand: npm run db:migrate
            startCommand: npm run start
            healthCheckPath: /api/health
            scaling:
              minInstances: 1
              maxInstances: 3
              targetCPUPercent: 70
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production
              - key: NODE_ENV
                value: production
              # APP_URL is set here *and* in shipblu-support-production, and this
              # copy wins on this service. The crons read the group's; they build
              # no links, and `appUrl()` asks for the variable only where a link
              # is actually constructed. Once the two values are confirmed
              # identical this copy can go, and the group's serves everyone.
              - key: APP_URL
                sync: false
              # EMAIL_WEBHOOK_SECRET belongs here and is **not set anywhere
              # today**: only the web service receives inbound webhooks, so the
              # Basic Auth password Postmark presents would live on its one
              # consumer. Unset, lib/email/providers/postmark.ts accepts inbound
              # mail unauthenticated and logs a warning saying so. Setting it is
              # a pair with the Postmark inbound webhook URL's credentials —
              # set one without the other and every inbound mail is rejected.
              # Debug switch, normally unset. `true` prints every inbound webhook
              # — headers and raw body — before it is verified or parsed, which
              # is the only way to tell a delivery that was rejected from one
              # that never arrived. Deliberately on the web service alone: it is
              # the only service with an inbound endpoint, and scoping it here
              # keeps it out of the group and off the worker and crons.
              #
              # Turn it off again after the session. It puts customer message
              # content into the Render log, which is a less protected place than
              # the database; credentials are redacted regardless.
              - key: LOG_ALL_INCOMING_WEBHOOKS
                sync: false
              # Re-declaring any other group key here would shadow the group and
              # take the service value instead.

          - type: worker
            name: shipblu-support-worker
            runtime: node
            region: frankfurt
            plan: starter # 512MB / 0.5 CPU — the worker is I/O bound, not CPU bound
            branch: main
            # Matches the dashboard. Nothing in production deploys itself — a
            # deploy is triggered by hand (docs/PROJECT-STATE.md §2).
            autoDeployTrigger: 'off' # quoted: bare off is YAML 1.1 for false
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm run worker
            # Dashboard-owned, listed rather than declared, and normally absent:
            #
            #   WORKER_CONCURRENCY        jobs in flight at once (default 5)
            #   WORKER_POLL_INTERVAL_MS   idle poll interval (default 1000)
            #
            # Both have defaults in lib/env.ts that are the intended steady
            # state, so these exist to turn the worker up or down without a
            # deploy — the one knob worth having when a backlog is draining too
            # slowly. Named here because the blueprint is meant to describe
            # everything the system reads, including what it reads only when
            # somebody overrides a default.
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production
              - key: NODE_ENV
                value: production
              # Shadows the group's APP_URL, as on the web service.
              - key: APP_URL
                sync: false
              # Freshdesk credentials are read only by the knowledge base
              # importer. It is a queued job, so it runs here on the worker —
              # which is where the dashboard has them. They can go once the
              # migration is done.
              - key: FRESHDESK_DOMAIN
                sync: false
              - key: FRESHDESK_API_KEY
                sync: false

          # ------------------------------------------------------- cron jobs
          # These run `npm run job -- <type>` directly rather than hitting an
          # HTTP endpoint: the cron run's exit code then reflects whether the
          # work actually succeeded, and there is no shared secret or request
          # timeout involved.
          #
          # None of them declares a variable of its own except shipblu-nightly.
          # They inherit APP_URL from shipblu-support-production but have no
          # use for it: a cron has no address of its own and builds no links,
          # and `appUrl()` asks for the variable only where a link is actually
          # constructed.

          # Two jobs on one schedule, chained the way shipblu-nightly chains
          # cleanup and the rollup. They want the same cadence and neither takes
          # long, and a cron service of its own would be a second container
          # booting every five minutes to run a query that usually returns
          # nothing.
          #
          # Order matters: the SLA sweep first, so a ticket the assignment sweep
          # is about to hand to somebody carries its breach flags when they open
          # it. `&&` rather than `;` — if the SLA sweep dies the run should go
          # red rather than reporting success because the second half worked.
          #
          # The presence sweep goes between them for the same reason, one step
          # earlier in the chain: it is what takes an agent who has walked away
          # out of the rota, so running it after the assignment sweep would hand
          # this round's tickets to somebody it is about to mark away. It is the
          # backstop rather than the mechanism — the console reports its own
          # idleness within seconds — so five-minute granularity only shows when
          # a browser could not report at all: a slept laptop, a frozen tab, an
          # instance replaced by a deploy.
          - type: cron
            name: shipblu-sla-sweep
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            # Matches the dashboard. Nothing in production deploys itself — a
            # deploy is triggered by hand (docs/PROJECT-STATE.md §2).
            autoDeployTrigger: 'off' # quoted: bare off is YAML 1.1 for false
            schedule: '*/5 * * * *' # SLA breaches need minute-ish resolution
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- sla_sweep && npm run job -- presence_sweep && npm run job -- assign_sweep
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production

          - type: cron
            name: shipblu-time-automations
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            # Matches the dashboard. Nothing in production deploys itself — a
            # deploy is triggered by hand (docs/PROJECT-STATE.md §2).
            autoDeployTrigger: 'off' # quoted: bare off is YAML 1.1 for false
            schedule: '*/15 * * * *'
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- run_time_automations
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production

          # This runs two jobs now, chained the way shipblu-nightly chains
          # cleanup and the rollup: both want an hourly cadence, neither takes
          # long, and a cron service of its own would be a second container
          # booting every hour to run one grouped count.
          #
          # **The name is deliberately not updated to match.** Renaming a service
          # in a Blueprint is a delete and a create, not a rename, and losing a
          # cron's history is a worse outcome than a name that is narrower than
          # what it runs.
          #
          # The backlog snapshot is hourly rather than once at midnight because
          # "open at day end" is the one productivity figure that cannot be
          # recomputed later, and Render's schedules are UTC while Cairo observes
          # DST — a fixed end-of-day cron is on the wrong side of midnight for
          # half the year. Sampling hourly lets the rollup pick the sample
          # nearest the boundary in the reporting zone instead.
          #
          # `;` rather than `&&`: the template sync is the half that depends on
          # Meta being configured, and a run that goes red there must not also
          # stop the snapshot, whose measurement cannot be taken again once the
          # hour has passed.
          - type: cron
            name: shipblu-whatsapp-template-sync
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            # Matches the dashboard. Nothing in production deploys itself — a
            # deploy is triggered by hand (docs/PROJECT-STATE.md §2).
            autoDeployTrigger: 'off' # quoted: bare off is YAML 1.1 for false
            schedule: '0 * * * *'
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- sync_whatsapp_templates; npm run job -- snapshot_backlog
            envVars:
              # WHATSAPP_WABA_ID and META_PAGE_ACCESS_TOKEN come from
              # shipblu-shared today. The handler skips cleanly while they are unset, so
              # this cron is green from the day the Blueprint creates it rather
              # than red until Meta is configured.
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production

          - type: cron
            name: shipblu-nightly
            runtime: node
            region: frankfurt
            plan: starter
            branch: main
            # Matches the dashboard. Nothing in production deploys itself — a
            # deploy is triggered by hand (docs/PROJECT-STATE.md §2).
            autoDeployTrigger: 'off' # quoted: bare off is YAML 1.1 for false
            # 02:00 Africa/Cairo = 00:00 UTC. Render cron schedules are UTC.
            schedule: '0 0 * * *'
            buildCommand: npm ci --include=dev
            startCommand: npm run job -- cleanup && npm run job -- rollup_metrics
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-production
              # The per-service exception lib/env.ts describes for this variable,
              # and the one service that is the case it describes: the 30-second
              # default is calibrated for a request path, where "a page that has
              # been waiting thirty seconds has already lost its reader". This
              # is unattended maintenance with no reader at all, and retention
              # legitimately scans two tables that grow without bound.
              #
              # Set on 2026-09-25 after the cleanup job was cancelled mid-delete
              # twice in five nights (57014) — see docs/PROJECT-STATE.md §6.68.
              # This *is* the fix rather than a stop-gap, which took a wrong
              # turn to establish: batching the delete was tried first and is
              # strictly worse, because the cost is a sequential scan to find
              # the rows and batching pays it once per batch. The scan is ~19 s
              # on a 436,200-row table at steady state; three minutes is real
              # headroom against the growth, and indexing the predicate is the
              # optimisation §6.68 leaves open.
              #
              # **It covers `rollup_metrics` too**, which is the second job on
              # this cron and is not what the headroom was measured for. That is
              # accepted rather than overlooked: the rollup is a delete-and-
              # insert rebuild that runs in ~3 s, so a run that reaches even 30 s
              # is already wrong in a way a tighter deadline would only truncate
              # rather than diagnose. Below the `transaction_timeout = '5min'`
              # on the postgres role deliberately, so which limit fired is
              # legible.
              - key: DB_QUERY_TIMEOUT_MS
                value: '180000'

      # --------------------------------------------------------------- staging
      - name: Staging
        envVarGroups:
          - name: shipblu-support-staging
            envVars:
              # Staging never reaches a real customer, and this group is most of
              # how that is guaranteed.
              #
              # EMAIL_PROVIDER=local writes to .mail-outbox/ instead of calling
              # Postmark. It is set here rather than as a service-level override
              # so that it holds for anything added to this environment later —
              # a staging worker, say — instead of only for the one service
              # somebody remembered to write it on.
              #
              # The one literal left in this file, kept on purpose: unlike the
              # values removed elsewhere, writing it can only stop a send, never
              # start one. It is **not a guarantee today**, though. shipblu-shared
              # also holds EMAIL_PROVIDER, the staging service links both groups,
              # and Render documents no tiebreak between two groups — so which
              # value staging reads is undefined until the shared copy moves to
              # shipblu-support-production.
              #
              # The same move is owed for the Meta credentials and
              # TYPESAFE_API_KEY, which staging currently inherits from
              # shipblu-shared (see the note there). `pageToken()` in
              # lib/meta/client.ts throws "META_PAGE_ACCESS_TOKEN is not
              # configured" on an unset value, which is the state staging is
              # meant to be in. Do not resume staging before both are done.
              - key: EMAIL_PROVIDER
                value: local

              # Dashboard-owned, listed rather than declared:
              #
              #   DATABASE_URL             staging's own Supabase project
              #   DATABASE_URL_SESSION
              #   SUPABASE_URL
              #   SUPABASE_SERVICE_ROLE_KEY
              #
              # Its own database, so that its migrations run against staging
              # rather than production.

        services:
          - type: web
            name: shipblu-support-staging
            runtime: node
            region: frankfurt
            plan: starter
            # `main`, as the running service says. This used to name the
            # feature branch claude/shipblu-support-app-03p2we, which has since
            # been deleted — and a branch that does not exist fails the whole
            # Blueprint sync, not just this service (docs/PROJECT-STATE.md
            # §6.67, §6.71).
            branch: main
            # The only service in the project that deploys itself: resuming
            # staging arms a deploy of `main` on the next commit, against
            # staging's own database.
            autoDeployTrigger: commit
            buildCommand: npm ci --include=dev && npm run build
            preDeployCommand: npm run db:migrate
            startCommand: npm run start
            healthCheckPath: /api/health
            envVars:
              - fromGroup: shipblu-shared
              - fromGroup: shipblu-support-staging
              - key: NODE_ENV
                value: production
              - key: APP_URL
                sync: false
