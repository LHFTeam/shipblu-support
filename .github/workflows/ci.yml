name: CI

# Everything AGENTS.md used to ask an agent to run before pushing, plus the
# checks it could only ask them to remember.
#
# The pre-push loop (tsc, eslint, format, vitest, knip, build) is the `verify`
# job. `format` and `knip` are the two most likely to fail for a reason that has
# nothing to do with the code under review, so read the job name before the log.
#
# `repo-rules` is the prose that a machine can check. `database` is the gap
# AGENTS.md called out and could not close: the unit tests run without a
# database, so no SQL was ever executed before a push — `backfill_meta_profiles`
# shipped with every static check green and died on its first real run with
# `operator does not exist: text = channel`. Here it runs against real Postgres.

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a follow-up commit makes the previous run's answer irrelevant,
# so a branch's older run is cancelled. Main is exempt: its runs are the record
# of what was merged, so each push to main gets a group of its own. Sharing one
# group did not cancel a running main build, but a group holds a single pending
# run and GitHub cancels it when another arrives — so a quick run of merges left
# the middle ones reading "cancelled", with no result at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every action is pinned to a commit, with the release it was in a comment
# beside it. A tag is a pointer its owner can move, and whatever it points at
# runs with this workflow's token and the repository's code; a commit cannot be
# moved. Dependabot (.github/dependabot.yml) proposes the next release as a
# reviewable diff, which is the only way a pin changes.
#
# Every checkout sets `persist-credentials: false` for the same reason. The
# default leaves the job's token readable for the rest of the job, in a file
# `.git/config` points to, and the next step is `npm ci`, which runs third-party
# install scripts. No step fetches or pushes after checkout, so nothing needs it.

env:
  # Node 22, matching the `engines` pin in package.json (>=22 <23).
  NODE_VERSION: '22'

jobs:
  # -------------------------------------------------------------------------
  # The pre-push loop.
  #
  # One job per check rather than one job running all of them, so a red run says
  # which check failed in the job list instead of only in the log — and so a
  # typecheck failure does not hide a test failure behind it.
  # -------------------------------------------------------------------------
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same npm scripts a contributor runs, so what passes locally and
          # what passes here cannot drift apart — `lint` carries
          # --max-warnings=0, which a bare `npx eslint .` would not.
          - name: typecheck
            run: npm run typecheck
          - name: lint
            run: npm run lint
          - name: format
            run: npm run format:check
          - name: test
            run: npm run test
          - name: knip
            # Dependency hygiene only, named as a positive allowlist in
            # knip.jsonc — which is also where the reasoning lives for why the
            # unused-export categories and `files` are not gated. An unlisted
            # dependency is the one that bites without warning: it resolves
            # today through somebody else's transitive tree and stops the day
            # that package tidies its own.
            run: npm run knip
          - name: build
            # `npm run build` pins NODE_ENV=production deliberately. Several
            # failure modes here — React's export-condition resolution under the
            # wrong NODE_ENV, ambiguous route segments — appear only at build
            # time and never in tsc or the dev server, which is why this is not
            # optional. A build failing with "Cannot read properties of null
            # (reading 'useContext')" is the environment, not the React version.
            run: npm run build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  # -------------------------------------------------------------------------
  # The rules that used to live only in prose.
  # -------------------------------------------------------------------------
  repo-rules:
    name: repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The migrations-are-append-only check diffs against the base branch,
          # which needs more than the default single commit. The history is
          # fetched here, during checkout, so the token need not outlive it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: AGENTS.md invariants
        run: node scripts/ci/repo-rules.mjs

      # db/migrations is generated from db/schema by `npm run db:generate`. If
      # regenerating produces a diff, either a migration was hand-edited or a
      # schema change was committed without one — and the next generated
      # migration would then be diffed against a schema state the database was
      # never in. `drizzle-kit generate` opens no connection, so this needs no
      # database.
      - name: Migrations match db/schema
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet -- db/migrations; then
            echo "::error::db/migrations is out of sync with db/schema."
            echo "Run 'npm run db:generate' and commit the result; never hand-edit a migration."
            git --no-pager diff --stat -- db/migrations
            exit 1
          fi
          echo "db/migrations is in sync with db/schema."

  # -------------------------------------------------------------------------
  # SQL, executed.
  #
  # Postgres 17 to match production and staging: db/migrate.ts opts out of the
  # role-level `transaction_timeout`, which is a 17-and-later setting it checks
  # the server version before touching.
  # -------------------------------------------------------------------------
  database:
    name: database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shipblu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipblu_ci
      DATABASE_URL_SESSION: postgresql://postgres:postgres@localhost:5432/shipblu_ci
      # Long enough for the Zod schema, and a placeholder: nothing in this job
      # signs anything a person will ever receive.
      APP_SECRET: ci-placeholder-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Proves the migrations and every file in db/sql actually execute. `tsc`
      # type-checks the Drizzle builder, not the statement it emits, and a raw
      # `sql` fragment is a template string to every other check in this file.
      - name: Apply migrations to an empty database
        run: npm run db:migrate

      # db/sql is replayed after every deploy, so each file has to survive being
      # run again. The second run is the assertion.
      - name: Replay is idempotent
        run: npm run db:migrate

      # The bilingual backfill is the one file in db/sql whose whole job is rows
      # that already exist, so replaying it against an empty database proves
      # nothing about it. Seed the shape it exists for — content in the
      # superseded column and the pair still at its default, which is what every
      # row looked like the moment migration 0025 finished — then replay, and
      # check both that it landed and that it landed in the right language.
      #
      # The second replay is the other half. A backfill that is not idempotent
      # is worse than one that never ran: this file is re-applied after every
      # deploy, so it would keep overwriting whatever the console had since
      # written.
      - name: The bilingual backfill moves a pre-split row, once
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/bilingual-backfill-seed.sql

          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/bilingual-backfill-landed.sql

          # Change what it wrote, replay, and it must still be what we changed it
          # to — the guard is "both sides blank", not "the legacy column exists".
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "update canned_responses set body_text_ar = 'edited in the console' where title = 'arabic';"
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/bilingual-backfill-kept-edit.sql

          # Left empty for the steps below, which assume the database they were
          # handed.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "delete from canned_responses; delete from holidays; delete from business_hours;"

      - name: Row level security invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/db-invariants.sql

      # Exercise the application's cleanup query with regular and side-message
      # jobs. The test always rolls its fixtures back and opens only this
      # explicitly supplied disposable database, never the app's default URL.
      - name: Purges preserve unrelated queued work
        run: TEST_DATABASE_URL="$DATABASE_URL" npx vitest run lib/admin/purge-jobs.db.test.ts lib/admin/purge-integration.db.test.ts

      # The jobs whose whole body is SQL, run against the schema that was just
      # built. Their predicates match nothing on an empty database, which is
      # fine — Postgres still plans every statement, and planning is where
      # `operator does not exist: text = channel` is raised. That is the class of
      # failure this job exists for.
      #
      # Which jobs, and why each of the others is left out, is
      # scripts/ci/db-jobs.txt; the `db-jobs` rule holds it to the JobType
      # union, so a new job type cannot be missed here without failing CI.
      - name: Job handlers execute their SQL
        run: |
          set -euo pipefail
          mapfile -t jobs < <(sed -n 's/^run: //p' scripts/ci/db-jobs.txt)
          # `set -e` does not see a failure inside `< <(...)`: a missing list
          # would run nothing and pass. repo-rules catches that too, but this
          # step should not be the one that goes green.
          [ "${#jobs[@]}" -gt 0 ] || { echo "no jobs read from scripts/ci/db-jobs.txt"; exit 1; }
          for job in "${jobs[@]}"; do
            echo "::group::npm run job -- $job"
            # Unquoted on purpose: a line's key=value arguments are separate words.
            npm run job -- $job
            echo "::endgroup::"
          done

      # Not in the loop above, because unlike those this one writes — so it can
      # carry a real assertion rather than only proving its SQL plans. Run once
      # it seeds the handbook into an empty knowledge base; run again it must
      # find everything current and change nothing. That is the same shape as
      # the db/sql replay above, and it is the property that lets the job be
      # re-run to ship a content fix without reverting anybody's edits.
      - name: The console handbook seeds idempotently
        run: |
          set -euo pipefail
          npm run job -- seed_console_handbook
          before=$(psql "$DATABASE_URL" -tAc "select count(*) from kb_articles")
          npm run job -- seed_console_handbook overwrite=true | tee /tmp/second-run.log
          after=$(psql "$DATABASE_URL" -tAc "select count(*) from kb_articles")
          versions=$(psql "$DATABASE_URL" -tAc "select count(*) from kb_article_versions")

          test "$before" = "$after" || {
            echo "::error::second run changed the article count: $before -> $after"; exit 1; }
          test "$versions" = "0" || {
            echo "::error::second run rewrote $versions article(s) that were already current"; exit 1; }
          # Anchored to the whole field: a bare `grep -q "0 rewritten"` also
          # matches "10 rewritten", which is the run this is meant to catch.
          grep -qE "articles [0-9]+ created, 0 rewritten," /tmp/second-run.log || {
            echo "::error::second run reported a rewrite"; exit 1; }

          # And the audience, which is the whole point of the folders: every one
          # of them internal, and every role on the ladder addressed. A folder
          # that lost its floor is how a supervisor article reaches every agent.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/handbook-audience.sql
